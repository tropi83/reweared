# written by ccgh init; edits are overwritten
name: ccgh-reconcile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: Hova25/ccgh-bridge@v1
        with:
          command: bridge reconcile
