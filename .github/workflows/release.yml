name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            target: ""
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The public https origin of the API (repository variable); `pnpm tauri build` generates the app's
          # permission and CSP for it (scripts/tauri.mjs) and refuses to build without it.
          VITE_API_ORIGIN: ${{ vars.API_ORIGIN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "AI Image Variations ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
