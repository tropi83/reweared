# written by ccgh init; edits are overwritten
name: ccgh-fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fixes:
    if: startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: Hova25/ccgh-bridge@v1
        with:
          command: bridge fixes
        env:
          BRIDGE_BRANCH: ${{ github.head_ref }}
          BRIDGE_PR: ${{ github.event.pull_request.number }}
