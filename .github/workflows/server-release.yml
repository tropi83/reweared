name: Server images

# Builds the api/worker ("server"), Caddy+web ("web") and backup ("backup") images for a release tag, scans them, and only then publishes
# them to GHCR as <version> and sha-<short>. Pre-release tags (v0.0.0-rc.1) publish too, as their own tag: the
# production compose names a version explicitly, so nothing moves by itself. Desktop bundles are release.yml.
# Action versions checked on 2026-10-17; trivy-action is pinned by commit (v0.36.0).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the images to GHCR (off = build and scan only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: Image · ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR with the workflow's own token; no other registry secret
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aiv-server
            target: server
          - image: aiv-web
            target: web
          - image: aiv-backup
            target: backup
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Version
        id: version
        run: |
          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            version="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - name: Build (loaded locally for the scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          build-args: VITE_API_ORIGIN=/
          load: true
          tags: scan/${{ matrix.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Scan (fails on fixable critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: scan/${{ matrix.image }}:${{ steps.version.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish with SBOM and provenance
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          build-args: VITE_API_ORIGIN=/
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.version.outputs.repo }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.repo }}:${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
