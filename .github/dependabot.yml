version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["eslint*", "prettier*", "typescript*", "vitest*", "@vitest/*", "@testing-library/*", "jsdom"]
      tauri-js:
        patterns: ["@tauri-apps/*"]
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
