[package]
name = "tauri-plugin-vinted-webview"
version = "0.1.0"
description = "Post on Vinted from Android and iOS: a native WebView that pre-fills the sell form (never publishes)."
edition = "2021"
rust-version = "1.88"
links = "tauri-plugin-vinted-webview"
publish = false

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
